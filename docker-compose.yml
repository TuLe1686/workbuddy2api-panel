# us-biz2 生产编排。不要照抄上游 0.0.0.0:7863。
# 数据只放 DATA_ROOT/shared，不进 Release。
name: workbuddy2api-panel

services:
  wb2api:
    build: .
    image: workbuddy2api-panel:v1.11.3
    pull_policy: build
    container_name: workbuddy2api
    restart: unless-stopped
    user: "10001:10001"
    environment:
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:7863:7863"
    volumes:
      - /www/apps/workbuddy2api-panel/shared/auths:/app/auths
      - /www/apps/workbuddy2api-panel/shared/data:/app/data
      - /www/apps/workbuddy2api-panel/shared/config.json:/app/config.json
    # 上游镜像 HEALTHCHECK 打 /healthz：空账号池返回 503，compose --wait 会卡住。
    # /panel/ 无鉴权恒 200，只表示进程活着，不把“有可用账号”当启动门禁。
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:7863/panel/"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
